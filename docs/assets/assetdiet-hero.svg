<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" fill="none">
  <defs>
    <radialGradient id="hero-bg-glow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#C4F269" stop-opacity="0.09"/>
      <stop offset="70%" stop-color="#8B83FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#151719" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F7F2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F6F7F2" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="lime-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4F269"/>
      <stop offset="100%" stop-color="#C4F269" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="#151719"/>
  <rect width="1200" height="440" rx="16" fill="url(#hero-bg-glow)"/>
  <rect x="1" y="1" width="1198" height="438" rx="15" stroke="url(#panel-stroke)" stroke-width="2"/>

  <!-- Subtle Blueprint Background Grid (100px cells) -->
  <g opacity="0.05" stroke="#F6F7F2" stroke-width="1">
    <path d="M 0 80 H 1200 M 0 160 H 1200 M 0 240 H 1200 M 0 320 H 1200 M 0 400 H 1200"/>
    <path d="M 120 0 V 440 M 240 0 V 440 M 360 0 V 440 M 480 0 V 440 M 600 0 V 440 M 720 0 V 440 M 840 0 V 440 M 960 0 V 440 M 1080 0 V 440"/>
  </g>

  <!-- LEFT HERO SECTION: Brand, Tagline, Value Pillars -->
  <g transform="translate(64, 52)">
    <!-- Brand Lockup: Mark + Wordmark -->
    <g transform="translate(0, 0)">
      <!-- Mark Icon Container -->
      <rect width="68" height="68" rx="18" fill="#191C1E"/>
      <rect x="0.5" y="0.5" width="67" height="67" rx="17.5" stroke="#F6F7F2" stroke-opacity="0.12"/>
      <!-- Scaled Mark -->
      <g transform="translate(11, 11) scale(0.26)">
        <rect fill="#C4F269" fill-opacity="0.75" x="0" y="0" width="46" height="26" rx="7"/>
        <rect fill="#C4F269" fill-opacity="0.75" x="0" y="34" width="26" height="46" rx="7"/>
        <rect fill="#C4F269" x="34" y="34" width="36" height="36" rx="8"/>
        <path fill="#C4F269" d="M 80 0 H 130 C 155 0 176 21 176 46 V 74 C 176 80 171 85 165 85 H 142 C 136 85 131 80 131 74 V 46 C 131 38 124 31 116 31 H 80 C 74 31 70 26 70 20 V 11 C 70 5 74 0 80 0 Z"/>
        <path fill="#C4F269" d="M 80 50 H 108 C 114 50 119 55 119 61 V 85 C 119 91 114 96 108 96 H 80 C 74 96 70 91 70 85 V 61 C 70 55 74 50 80 50 Z"/>
        <circle fill="#8B83FF" cx="52" cy="13" r="4.5"/>
        <rect fill="#C4F269" x="80" y="112" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="114" y="112" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="148" y="112" width="28" height="26" rx="6"/>
        <rect fill="#C4F269" x="80" y="146" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="114" y="146" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="148" y="146" width="28" height="26" rx="6"/>
      </g>

      <!-- Wordmark Title -->
      <text x="86" y="52" class="font-sans" font-size="46" font-weight="800" letter-spacing="-0.04em">
        <tspan fill="#F6F7F2">Asset</tspan><tspan fill="#C4F269">Diet</tspan>
      </text>
      <rect x="330" y="24" width="76" height="24" rx="12" fill="#C4F269" fill-opacity="0.15"/>
      <text x="368" y="40" class="font-mono" font-size="11" font-weight="700" fill="#C4F269" text-anchor="middle">v0.1.0</text>
    </g>

    <!-- Core Philosophy Statement -->
    <text x="0" y="122" class="font-sans" font-size="24" font-weight="600" fill="#F6F7F2" letter-spacing="-0.02em">
      Many heavy assets go in. Lean, verified assets come out.
    </text>

    <!-- Sub-tagline -->
    <text x="0" y="156" class="font-sans" font-size="15" font-weight="400" fill="#F6F7F2" fill-opacity="0.65" letter-spacing="-0.01em">
      Local-first CLI &amp; MCP server for auditing, optimizing and safely managing repository assets.
    </text>

    <!-- Verification / Safety Pills -->
    <g transform="translate(0, 196)">
      <!-- Pill 1 -->
      <rect width="144" height="30" rx="8" fill="#1E2226" stroke="#F6F7F2" stroke-opacity="0.1"/>
      <circle cx="16" cy="15" r="4" fill="#C4F269"/>
      <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#F6F7F2">100% Local Run</text>

      <!-- Pill 2 -->
      <g transform="translate(154, 0)">
        <rect width="168" height="30" rx="8" fill="#1E2226" stroke="#F6F7F2" stroke-opacity="0.1"/>
        <circle cx="16" cy="15" r="4" fill="#C4F269"/>
        <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#F6F7F2">Zero Cloud Upload</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(332, 0)">
        <rect width="180" height="30" rx="8" fill="#1E2226" stroke="#F6F7F2" stroke-opacity="0.1"/>
        <circle cx="16" cy="15" r="4" fill="#8B83FF"/>
        <text x="28" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#F6F7F2">Atomic Undo / Restore</text>
      </g>
    </g>

    <!-- Engine Support Badges -->
    <g transform="translate(0, 260)">
      <text x="0" y="12" class="font-mono" font-size="11" font-weight="700" fill="#F6F7F2" fill-opacity="0.4" letter-spacing="0.08em">ENGINES &amp; MEDIA TYPES</text>
      <g transform="translate(0, 26)">
        <!-- Raster (Sharp) -->
        <rect width="112" height="26" rx="6" fill="#1A1D20" stroke="#C4F269" stroke-opacity="0.25"/>
        <text x="56" y="17" class="font-mono" font-size="11" font-weight="600" fill="#C4F269" text-anchor="middle">Sharp (Images)</text>

        <!-- Vectors (SVGO) -->
        <g transform="translate(120, 0)">
          <rect width="104" height="26" rx="6" fill="#1A1D20" stroke="#C4F269" stroke-opacity="0.25"/>
          <text x="52" y="17" class="font-mono" font-size="11" font-weight="600" fill="#C4F269" text-anchor="middle">SVGO (Vector)</text>
        </g>

        <!-- 3D (glTF-Transform) -->
        <g transform="translate(232, 0)">
          <rect width="134" height="26" rx="6" fill="#1A1D20" stroke="#C4F269" stroke-opacity="0.25"/>
          <text x="67" y="17" class="font-mono" font-size="11" font-weight="600" fill="#C4F269" text-anchor="middle">glTF-Transform (3D)</text>
        </g>

        <!-- Video (FFmpeg) -->
        <g transform="translate(374, 0)">
          <rect width="124" height="26" rx="6" fill="#1A1D20" stroke="#8B83FF" stroke-opacity="0.3"/>
          <text x="62" y="17" class="font-mono" font-size="11" font-weight="600" fill="#8B83FF" text-anchor="middle">FFmpeg (Video)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT HERO SECTION: Interactive Architecture / Terminal Audit Card -->
  <g transform="translate(680, 48)">
    <!-- Container Card -->
    <rect width="456" height="344" rx="14" fill="#101214" stroke="#F6F7F2" stroke-opacity="0.12"/>

    <!-- Mac-style Window Bar -->
    <rect width="456" height="38" rx="14" fill="#171A1C"/>
    <circle cx="20" cy="19" r="5" fill="#FF5F56" fill-opacity="0.8"/>
    <circle cx="36" cy="19" r="5" fill="#FFBD2E" fill-opacity="0.8"/>
    <circle cx="52" cy="19" r="5" fill="#27C93F" fill-opacity="0.8"/>
    <text x="228" y="23" class="font-mono" font-size="11.5" fill="#F6F7F2" fill-opacity="0.5" text-anchor="middle">assetdiet audit --policy safe</text>

    <!-- Terminal Output Lines -->
    <g transform="translate(20, 58)">
      <!-- Command prompt -->
      <text x="0" y="14" class="font-mono" font-size="12" fill="#8B83FF">$</text>
      <text x="16" y="14" class="font-mono" font-size="12" fill="#F6F7F2" font-weight="600">assetdiet audit ./web-app --policy safe</text>

      <text x="0" y="38" class="font-mono" font-size="11.5" fill="#F6F7F2" fill-opacity="0.5">🔍 Scanning repository assets (SHA-256 graph)...</text>
      <text x="0" y="56" class="font-mono" font-size="11.5" fill="#C4F269">✓ 42 assets scanned across 6 media formats</text>

      <!-- Divider -->
      <line x1="0" y1="72" x2="416" y2="72" stroke="#F6F7F2" stroke-opacity="0.08"/>

      <!-- Optimization Preview Rows -->
      <g transform="translate(0, 88)">
        <!-- Row 1: Image -->
        <text x="0" y="12" class="font-mono" font-size="11" fill="#C4F269">[IMAGE]</text>
        <text x="56" y="12" class="font-mono" font-size="11" fill="#F6F7F2">hero-banner.png</text>
        <text x="250" y="12" class="font-mono" font-size="11" fill="#F6F7F2" fill-opacity="0.5">1.8 MB → 390 KB</text>
        <text x="368" y="12" class="font-mono" font-size="11" font-weight="700" fill="#C4F269">-78.3%</text>

        <!-- Row 2: SVG -->
        <text x="0" y="32" class="font-mono" font-size="11" fill="#C4F269">[SVG]</text>
        <text x="56" y="32" class="font-mono" font-size="11" fill="#F6F7F2">icons/symbols.svg</text>
        <text x="250" y="32" class="font-mono" font-size="11" fill="#F6F7F2" fill-opacity="0.5">84 KB → 28 KB</text>
        <text x="368" y="32" class="font-mono" font-size="11" font-weight="700" fill="#C4F269">-66.7%</text>

        <!-- Row 3: 3D Model -->
        <text x="0" y="52" class="font-mono" font-size="11" fill="#C4F269">[3D]</text>
        <text x="56" y="52" class="font-mono" font-size="11" fill="#F6F7F2">models/character.glb</text>
        <text x="250" y="52" class="font-mono" font-size="11" fill="#F6F7F2" fill-opacity="0.5">4.2 MB → 1.1 MB</text>
        <text x="368" y="52" class="font-mono" font-size="11" font-weight="700" fill="#C4F269">-73.8%</text>

        <!-- Row 4: Duplicate group detected -->
        <text x="0" y="72" class="font-mono" font-size="11" fill="#8B83FF">[DEDUP]</text>
        <text x="56" y="72" class="font-mono" font-size="11" fill="#F6F7F2">logo-footer.png (3 dups)</text>
        <text x="250" y="72" class="font-mono" font-size="11" fill="#F6F7F2" fill-opacity="0.5">Reclaim identical</text>
        <text x="368" y="72" class="font-mono" font-size="11" font-weight="700" fill="#8B83FF">340 KB</text>
      </g>

      <!-- Bottom Savings Summary Banner -->
      <g transform="translate(0, 186)">
        <rect width="416" height="56" rx="8" fill="#1A2016" stroke="#C4F269" stroke-opacity="0.3"/>
        <text x="16" y="24" class="font-sans" font-size="12" font-weight="700" fill="#C4F269">AUDIT ESTIMATED SAVINGS: 4.8 MB (-72.4%)</text>
        <text x="16" y="42" class="font-mono" font-size="10.5" fill="#F6F7F2" fill-opacity="0.7">Validation quality gates passed · 0 visual regression</text>
        <!-- Restore note -->
        <rect x="330" y="16" width="70" height="24" rx="4" fill="#C4F269"/>
        <text x="365" y="32" class="font-mono" font-size="10" font-weight="800" fill="#151719" text-anchor="middle">SAFE</text>
      </g>
    </g>
  </g>
</svg>
