<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="sp-glow-top" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#C4F269" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#8B83FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#151719" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-glow-bot" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#C4F269" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#151719" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F7F2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F6F7F2" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <style>
    .sp-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .sp-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#151719"/>
  <rect width="1200" height="630" fill="url(#sp-glow-top)"/>
  <rect width="1200" height="630" fill="url(#sp-glow-bot)"/>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="626" rx="20" stroke="url(#sp-border)" stroke-width="2"/>

  <!-- Architectural Background Grid -->
  <g opacity="0.04" stroke="#F6F7F2" stroke-width="1">
    <path d="M 0 105 H 1200 M 0 210 H 1200 M 0 315 H 1200 M 0 420 H 1200 M 0 525 H 1200"/>
    <path d="M 120 0 V 630 M 240 0 V 630 M 360 0 V 630 M 480 0 V 630 M 600 0 V 630 M 720 0 V 630 M 840 0 V 630 M 960 0 V 630 M 1080 0 V 630"/>
  </g>

  <!-- LEFT COLUMN: Brand Identity & Product Scope -->
  <g transform="translate(80, 84)">
    <!-- Top Identity: Mark + Monogram -->
    <g transform="translate(0, 0)">
      <!-- Mark Squircle -->
      <rect width="92" height="92" rx="24" fill="#1C1F22"/>
      <rect x="1" y="1" width="90" height="90" rx="23" stroke="#F6F7F2" stroke-opacity="0.12"/>
      <!-- Scaled Mark Glyph -->
      <g transform="translate(15, 15) scale(0.35)">
        <rect fill="#C4F269" fill-opacity="0.75" x="0" y="0" width="46" height="26" rx="7"/>
        <rect fill="#C4F269" fill-opacity="0.75" x="0" y="34" width="26" height="46" rx="7"/>
        <rect fill="#C4F269" x="34" y="34" width="36" height="36" rx="8"/>
        <path fill="#C4F269" d="M 80 0 H 130 C 155 0 176 21 176 46 V 74 C 176 80 171 85 165 85 H 142 C 136 85 131 80 131 74 V 46 C 131 38 124 31 116 31 H 80 C 74 31 70 26 70 20 V 11 C 70 5 74 0 80 0 Z"/>
        <path fill="#C4F269" d="M 80 50 H 108 C 114 50 119 55 119 61 V 85 C 119 91 114 96 108 96 H 80 C 74 96 70 91 70 85 V 61 C 70 55 74 50 80 50 Z"/>
        <circle fill="#8B83FF" cx="52" cy="13" r="4.5"/>
        <rect fill="#C4F269" x="80" y="112" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="114" y="112" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="148" y="112" width="28" height="26" rx="6"/>
        <rect fill="#C4F269" x="80" y="146" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="114" y="146" width="26" height="26" rx="6"/>
        <rect fill="#C4F269" x="148" y="146" width="28" height="26" rx="6"/>
      </g>

      <!-- Wordmark -->
      <text x="116" y="68" class="sp-sans" font-size="58" font-weight="800" letter-spacing="-0.04em">
        <tspan fill="#F6F7F2">Asset</tspan><tspan fill="#C4F269">Diet</tspan>
      </text>
    </g>

    <!-- Tagline & Narrative -->
    <g transform="translate(0, 134)">
      <text class="sp-sans" font-size="28" font-weight="700" fill="#F6F7F2" letter-spacing="-0.02em">
        Many heavy assets go in.
      </text>
      <text y="36" class="sp-sans" font-size="28" font-weight="700" fill="#C4F269" letter-spacing="-0.02em">
        Lean, verified assets come out.
      </text>
      <text y="78" class="sp-sans" font-size="16" font-weight="400" fill="#F6F7F2" fill-opacity="0.7">
        Local-first CLI &amp; MCP server for auditing, optimizing, and
      </text>
      <text y="102" class="sp-sans" font-size="16" font-weight="400" fill="#F6F7F2" fill-opacity="0.7">
        safely managing images, SVGs, videos, and 3D assets.
      </text>
    </g>

    <!-- Technical Badges -->
    <g transform="translate(0, 290)">
      <rect width="136" height="32" rx="8" fill="#1F2327" stroke="#F6F7F2" stroke-opacity="0.1"/>
      <circle cx="16" cy="16" r="4" fill="#C4F269"/>
      <text x="28" y="20" class="sp-mono" font-size="12" font-weight="600" fill="#F6F7F2">100% Local</text>

      <g transform="translate(148, 0)">
        <rect width="156" height="32" rx="8" fill="#1F2327" stroke="#F6F7F2" stroke-opacity="0.1"/>
        <circle cx="16" cy="16" r="4" fill="#C4F269"/>
        <text x="28" y="20" class="sp-mono" font-size="12" font-weight="600" fill="#F6F7F2">Zero Telemetry</text>
      </g>

      <g transform="translate(316, 0)">
        <rect width="168" height="32" rx="8" fill="#1F2327" stroke="#F6F7F2" stroke-opacity="0.1"/>
        <circle cx="16" cy="16" r="4" fill="#8B83FF"/>
        <text x="28" y="20" class="sp-mono" font-size="12" font-weight="600" fill="#F6F7F2">Byte-Exact Undo</text>
      </g>
    </g>

    <!-- Supported Ecosystem Pills -->
    <g transform="translate(0, 344)">
      <text class="sp-mono" font-size="11" font-weight="700" fill="#F6F7F2" fill-opacity="0.45" letter-spacing="0.1em">AI CLIENTS &amp; AUTOMATION</text>
      <text y="24" class="sp-mono" font-size="13" font-weight="600" fill="#F6F7F2" fill-opacity="0.8">
        Cursor · Claude Desktop · Claude Code · Windsurf · Codex
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Restrained Visual Asset Optimization Engine Card -->
  <g transform="translate(640, 84)">
    <rect width="480" height="462" rx="16" fill="#111315" stroke="#F6F7F2" stroke-opacity="0.12"/>

    <!-- Header bar -->
    <rect width="480" height="44" rx="16" fill="#181B1E"/>
    <circle cx="22" cy="22" r="5" fill="#FF5F56" fill-opacity="0.8"/>
    <circle cx="38" cy="22" r="5" fill="#FFBD2E" fill-opacity="0.8"/>
    <circle cx="54" cy="22" r="5" fill="#27C93F" fill-opacity="0.8"/>
    <text x="240" y="27" class="sp-mono" font-size="12" fill="#F6F7F2" fill-opacity="0.6" text-anchor="middle">assetdiet audit --policy safe</text>

    <!-- Interior Cards: Heavy In -> Lean Out -->
    <g transform="translate(24, 66)">
      <!-- Left: Heavy In Block -->
      <g transform="translate(0, 0)">
        <text class="sp-mono" font-size="10.5" font-weight="700" fill="#F6F7F2" fill-opacity="0.4" letter-spacing="0.08em">HEAVY UNCHECKED IN</text>
        <g transform="translate(0, 14)">
          <!-- Asset Item 1: Raw Image -->
          <rect width="190" height="52" rx="8" fill="#191C1F" stroke="#F6F7F2" stroke-opacity="0.06"/>
          <text x="12" y="24" class="sp-mono" font-size="11" font-weight="600" fill="#F6F7F2">banner-raw.png</text>
          <text x="12" y="40" class="sp-mono" font-size="10.5" fill="#FF7B72">2,418 KB (uncompressed)</text>

          <!-- Asset Item 2: Bloated SVG -->
          <g transform="translate(0, 62)">
            <rect width="190" height="52" rx="8" fill="#191C1F" stroke="#F6F7F2" stroke-opacity="0.06"/>
            <text x="12" y="24" class="sp-mono" font-size="11" font-weight="600" fill="#F6F7F2">illustrations.svg</text>
            <text x="12" y="40" class="sp-mono" font-size="10.5" fill="#FF7B72">412 KB (metadata bloat)</text>
          </g>

          <!-- Asset Item 3: 3D Model -->
          <g transform="translate(0, 124)">
            <rect width="190" height="52" rx="8" fill="#191C1F" stroke="#F6F7F2" stroke-opacity="0.06"/>
            <text x="12" y="24" class="sp-mono" font-size="11" font-weight="600" fill="#F6F7F2">robot-mesh.glb</text>
            <text x="12" y="40" class="sp-mono" font-size="10.5" fill="#FF7B72">3,890 KB (coincident vtx)</text>
          </g>

          <!-- Total In Banner -->
          <g transform="translate(0, 186)">
            <rect width="190" height="34" rx="6" fill="#201719"/>
            <text x="95" y="21" class="sp-mono" font-size="11" font-weight="700" fill="#FF7B72" text-anchor="middle">Input: 6,720 KB</text>
          </g>
        </g>
      </g>

      <!-- Center Flow Arrow / Aperture -->
      <g transform="translate(202, 106)">
        <rect width="28" height="28" rx="8" fill="#1F241C" stroke="#C4F269" stroke-opacity="0.3"/>
        <path d="M 9 14 H 19 M 15 10 L 19 14 L 15 18" stroke="#C4F269" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Right: Lean Verified Out Block -->
      <g transform="translate(242, 0)">
        <text class="sp-mono" font-size="10.5" font-weight="700" fill="#C4F269" letter-spacing="0.08em">LEAN VERIFIED OUT</text>
        <g transform="translate(0, 14)">
          <!-- Verified Item 1: Modern WebP -->
          <rect width="190" height="52" rx="8" fill="#1A2016" stroke="#C4F269" stroke-opacity="0.25"/>
          <text x="12" y="24" class="sp-mono" font-size="11" font-weight="600" fill="#F6F7F2">banner-raw.webp</text>
          <text x="12" y="40" class="sp-mono" font-size="10.5" font-weight="700" fill="#C4F269">482 KB (-80.1%)</text>

          <!-- Verified Item 2: Stripped SVG -->
          <g transform="translate(0, 62)">
            <rect width="190" height="52" rx="8" fill="#1A2016" stroke="#C4F269" stroke-opacity="0.25"/>
            <text x="12" y="24" class="sp-mono" font-size="11" font-weight="600" fill="#F6F7F2">illustrations.svg</text>
            <text x="12" y="40" class="sp-mono" font-size="10.5" font-weight="700" fill="#C4F269">98 KB (-76.2%)</text>
          </g>

          <!-- Verified Item 3: Pruned glTF -->
          <g transform="translate(0, 124)">
            <rect width="190" height="52" rx="8" fill="#1A2016" stroke="#C4F269" stroke-opacity="0.25"/>
            <text x="12" y="24" class="sp-mono" font-size="11" font-weight="600" fill="#F6F7F2">robot-mesh.glb</text>
            <text x="12" y="40" class="sp-mono" font-size="10.5" font-weight="700" fill="#C4F269">1,024 KB (-73.7%)</text>
          </g>

          <!-- Total Out Banner -->
          <g transform="translate(0, 186)">
            <rect width="190" height="34" rx="6" fill="#1E2818"/>
            <text x="95" y="21" class="sp-mono" font-size="11" font-weight="800" fill="#C4F269" text-anchor="middle">Output: 1,604 KB</text>
          </g>
        </g>
      </g>

      <!-- Bottom Global Result Banner -->
      <g transform="translate(0, 246)">
        <rect width="432" height="64" rx="10" fill="#182016" stroke="#C4F269" stroke-opacity="0.4"/>
        <text x="16" y="26" class="sp-sans" font-size="14" font-weight="800" fill="#C4F269">
          TOTAL COMPRESSION SAVINGS: -76.1% (5,116 KB)
        </text>
        <text x="16" y="46" class="sp-mono" font-size="11" fill="#F6F7F2" fill-opacity="0.75">
          ✓ Dimensional parity verified · 0 alpha loss · Rollback ready
        </text>
      </g>
    </g>
  </g>
</svg>
