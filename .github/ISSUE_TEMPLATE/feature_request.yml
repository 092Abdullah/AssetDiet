name: Feature Request
description: Suggest a new feature or improvement for AssetDiet
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:

      value: |
        Thanks for suggesting an improvement!  
        Please describe the problem and the solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem are you trying to solve? Why is this useful?
      placeholder: Currently AssetDiet cannot...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have thought about.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, examples, related tools, or other context that would help.
