name: PR Automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    name: Triage PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Label by paths
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
        continue-on-error: true

      - name: Welcome comment on first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Thanks for opening a pull request on **AssetDiet**.

            Please ensure:
            - CI is green (`pnpm test`, typecheck, lint)
            - The change is focused and linked to an issue when applicable
            - Docs/tests are updated if behavior changes

            A maintainer will review shortly.
        continue-on-error: true
