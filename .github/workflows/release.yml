name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run publication (skip actual npm publish)'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-pack:
    name: Validate, Build & Pack Distribution Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code quality checks
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm lint

      - name: Run all tests
        run: pnpm test

      - name: Build distribution package
        run: pnpm --filter assetdiet-mcp build

      - name: Run package artifact tests
        run: pnpm --filter assetdiet-mcp test

      - name: Create npm release tarball
        id: pack
        run: |
          cd packages/assetdiet-mcp
          npm pack --dry-run
          TARBALL_NAME=$(npm pack)
          echo "tarball=$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean install and smoke test
        run: |
          TARBALL_PATH="packages/assetdiet-mcp/${{ steps.pack.outputs.tarball }}"
          mkdir -p /tmp/smoke-release
          cd /tmp/smoke-release
          npm init -y
          npm install "$GITHUB_WORKSPACE/$TARBALL_PATH"
          npx assetdiet --help
          npx assetdiet doctor --json
          npx assetdiet setup --dry-run --json

      - name: Upload release tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: assetdiet-mcp-tarball
          path: packages/assetdiet-mcp/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [validate-and-pack]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Download release tarball artifact
        uses: actions/download-artifact@v4
        with:
          name: assetdiet-mcp-tarball
          path: packages/assetdiet-mcp

      - name: Publish package to npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/assetdiet-mcp
          TARBALL=$(ls assetdiet-mcp-*.tgz | head -n 1)
          npm publish "$TARBALL" --access public --provenance
